<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Unforged architecture</title>
  <desc id="desc">Browser to CloudFront, which serves the SPA from S3 through Origin Access Control and forwards /api/* to an API Gateway HTTP API. The HTTP API invokes Node 22 arm64 Lambda functions, which use Aurora DSQL for the claim-once ledger, Amazon Bedrock Converse and then Amazon Textract to read screenshots, AWS KMS to sign receipts, and an S3 upload bucket whose objects expire after 24 hours. All in us-east-1.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" rx="20" fill="#ffffff"/>

  <text x="40" y="52" font-size="22" font-weight="700" fill="#0f172a">Unforged on AWS</text>
  <text x="40" y="78" font-size="14" fill="#475569">One region, us-east-1. Textract reads, code decides, each signed record is claimed once, KMS signs the receipt.</text>

  <rect x="40" y="200" width="130" height="80" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="105" y="235" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Browser</text>
  <text x="105" y="256" font-size="12" fill="#475569" text-anchor="middle">React SPA</text>

  <rect x="230" y="200" width="160" height="80" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="310" y="235" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">CloudFront</text>
  <text x="310" y="256" font-size="12" fill="#475569" text-anchor="middle">HTTPS, /api/* uncached</text>

  <rect x="230" y="360" width="160" height="80" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="310" y="395" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">S3 site bucket</text>
  <text x="310" y="416" font-size="12" fill="#475569" text-anchor="middle">private, via OAC</text>

  <rect x="450" y="200" width="160" height="80" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
  <text x="530" y="235" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">API Gateway</text>
  <text x="530" y="256" font-size="12" fill="#475569" text-anchor="middle">HTTP API</text>

  <rect x="670" y="150" width="170" height="200" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="755" y="180" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Lambda</text>
  <text x="755" y="199" font-size="12" fill="#475569" text-anchor="middle">Node 22, arm64</text>
  <text x="755" y="214" font-size="11.5" fill="#334155" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Shops</text>
  <text x="755" y="227" font-size="11.5" fill="#334155" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Alerts (DKIM)</text>
  <text x="755" y="240" font-size="11.5" fill="#334155" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Verify (DKIM)</text>
  <text x="755" y="253" font-size="11.5" fill="#334155" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Records (claim once)</text>
  <text x="755" y="266" font-size="11.5" fill="#334155" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Check</text>
  <text x="755" y="279" font-size="11.5" fill="#334155" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Read (screenshot)</text>
  <text x="755" y="292" font-size="11.5" fill="#334155" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Books (ledger)</text>
  <text x="755" y="305" font-size="11.5" fill="#334155" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Race</text>
  <text x="755" y="318" font-size="11.5" fill="#334155" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Migrate</text>
  <text x="755" y="331" font-size="11.5" fill="#334155" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Receipts (KMS)</text>

  <rect x="450" y="420" width="190" height="96" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="545" y="452" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Aurora DSQL</text>
  <text x="545" y="472" font-size="12" fill="#475569" text-anchor="middle">IAM token auth, OCC</text>
  <text x="545" y="491" font-size="12" fill="#475569" text-anchor="middle">claim key is unique</text>

  <rect x="670" y="420" width="170" height="96" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="755" y="452" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Bedrock, Textract</text>
  <text x="755" y="472" font-size="12" fill="#475569" text-anchor="middle">Bedrock Converse first</text>
  <text x="755" y="491" font-size="12" fill="#475569" text-anchor="middle">Textract last, live today</text>

  <rect x="870" y="200" width="110" height="80" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="925" y="231" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">AWS KMS</text>
  <text x="925" y="250" font-size="12" fill="#475569" text-anchor="middle">P-256 key</text>
  <text x="925" y="266" font-size="12" fill="#475569" text-anchor="middle">signs receipts</text>

  <rect x="870" y="420" width="110" height="96" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="925" y="452" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">S3 uploads</text>
  <text x="925" y="472" font-size="12" fill="#475569" text-anchor="middle">screenshots</text>
  <text x="925" y="491" font-size="12" fill="#475569" text-anchor="middle">expire 24 h</text>

  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="170" y1="240" x2="226" y2="240"/>
    <line x1="310" y1="280" x2="310" y2="356"/>
    <line x1="390" y1="240" x2="446" y2="240"/>
    <line x1="610" y1="240" x2="666" y2="240"/>
    <path d="M700,350 L700,385 L580,385 L580,416"/>
    <line x1="755" y1="350" x2="755" y2="416"/>
    <path d="M810,350 L810,385 L925,385 L925,416"/>
    <line x1="840" y1="240" x2="866" y2="240"/>
  </g>

  <text x="292" y="322" font-size="11" fill="#475569" text-anchor="end">static</text>
  <text x="418" y="230" font-size="11" fill="#475569" text-anchor="middle">/api/*</text>
  <text x="638" y="230" font-size="11" fill="#475569" text-anchor="middle">POST</text>
  <text x="640" y="378" font-size="11" fill="#475569" text-anchor="middle">claim in one txn</text>
  <text x="764" y="378" font-size="11" fill="#475569" text-anchor="start">read</text>
  <text x="868" y="378" font-size="11" fill="#475569" text-anchor="middle">PutObject</text>

  <text x="40" y="540" font-size="12" fill="#64748b">Defined in infra/app.ts (AWS CDK, TypeScript).</text>
</svg>
